<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>杨梓周的博客</title>
    <!-- Font Awesome 6 (免费版) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg: #f8f9fa;
            --bg-card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border: #e8e8f0;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --primary-dark: #4a3db8;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --max-width: 1100px;
            --header-height: 64px;
        }

        [data-theme="dark"] {
            --bg: #0f0e1a;
            --bg-card: #1a1a2e;
            --text: #eeeef6;
            --text-secondary: #b8b8d0;
            --text-muted: #6a6a8a;
            --border: #2a2a44;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        /* ===== 重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--header-height);
            min-height: 100vh;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--primary-dark);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 8px;
        }

        /* ===== 头部导航 ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            transition: background var(--transition), border var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-inner {
            width: 100%;
            max-width: var(--max-width);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-weight: 400;
            -webkit-text-fill-color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            padding: 4px 0;
            transition: color var(--transition);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width var(--transition);
        }
        .nav-links a:hover {
            color: var(--text);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: var(--primary);
        }
        .nav-links a.active::after {
            width: 100%;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 8px;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: var(--border);
            color: var(--text);
        }

        /* 移动端汉堡 */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-secondary);
            border-radius: 4px;
            transition: all var(--transition);
        }
        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 32px 24px 60px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 40px;
        }

        /* ===== 文章列表 ===== */
        .main-content {
            min-width: 0;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .page-subtitle {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 1rem;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .post-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
            border-color: var(--primary-light);
        }

        .post-card .post-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .post-card .post-meta .tag {
            background: var(--border);
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: background var(--transition);
        }
        .post-card .post-meta .tag:hover {
            background: var(--primary-light);
            color: #fff;
        }

        .post-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }
        .post-card h2 a {
            color: var(--text);
            transition: color var(--transition);
        }
        .post-card h2 a:hover {
            color: var(--primary);
        }

        .post-card .excerpt {
            color: var(--text-secondary);
            font-size: 0.98rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-card .read-more {
            display: inline-block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
            align-items: center;
            gap: 4px;
            transition: gap var(--transition);
        }
        .post-card .read-more:hover {
            gap: 8px;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }
        .sidebar-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: -0.2px;
            color: var(--text);
        }

        .sidebar-about {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .sidebar-about .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
        }
        .sidebar-about .name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .sidebar-about .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
        }

        .sidebar-categories .cat-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.92rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            transition: color var(--transition);
            cursor: pointer;
        }
        .sidebar-categories .cat-item:last-child {
            border-bottom: none;
        }
        .sidebar-categories .cat-item:hover {
            color: var(--primary);
        }
        .sidebar-categories .cat-count {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .sidebar-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sidebar-tags .tag-chip {
            background: var(--border);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            cursor: pointer;
        }
        .sidebar-tags .tag-chip:hover {
            background: var(--primary);
            color: #fff;
            transform: scale(1.04);
        }

        /* ===== 文章详情 (展开) ===== */
        .post-detail {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 40px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            animation: fadeSlide 0.4s ease;
        }
        .post-detail.open {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-detail .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap var(--transition);
        }
        .post-detail .back-btn:hover {
            gap: 10px;
        }

        .post-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .post-detail .detail-meta {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .post-detail .detail-meta .tag {
            background: var(--border);
            padding: 0 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .post-detail .detail-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .post-detail .detail-content p {
            margin-bottom: 16px;
        }
        .post-detail .detail-content h3 {
            color: var(--text);
            margin: 24px 0 12px;
            font-size: 1.3rem;
        }
        .post-detail .detail-content h4 {
            color: var(--text);
            margin: 20px 0 10px;
            font-size: 1.15rem;
        }
        .post-detail .detail-content blockquote {
            border-left: 4px solid var(--primary-light);
            padding-left: 20px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        .post-detail .detail-content ul {
            padding-left: 24px;
            margin-bottom: 16px;
        }
        .post-detail .detail-content li {
            margin-bottom: 6px;
        }
        .post-detail .detail-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 12px 0;
        }
        .post-detail .detail-content .poem {
            font-family: Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif;
            font-size: 1.15rem;
            line-height: 2.2;
            color: var(--text);
            text-align: center;
            padding: 24px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            margin: 20px 0;
        }
        .post-detail .detail-content .poem p {
            margin-bottom: 0;
        }
        .post-detail .detail-content .poem-note {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 12px;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0 18px;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 8px;
            font-size: 0.95rem;
            flex: 1;
            outline: none;
            color: var(--text);
            font-family: var(--font);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box .icon {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-family: var(--font);
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 32px 24px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .footer .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .footer .socials a {
            color: var(--text-muted);
            font-size: 1.6rem;
            transition: color var(--transition), transform var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .footer .socials a:hover {
            color: var(--primary);
            transform: translateY(-3px);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .container {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 24px 18px 40px;
            }
            .sidebar {
                order: 2;
            }
            .main-content {
                order: 1;
            }
            .post-card {
                padding: 20px 22px;
            }
            .post-detail {
                padding: 24px 22px;
            }
            .post-detail .detail-title {
                font-size: 1.6rem;
            }
            .header-inner {
                padding: 0 18px;
            }
            .nav-links {
                position: fixed;
                top: var(--header-height);
                left: 0;
                width: 100%;
                background: var(--bg-card);
                flex-direction: column;
                padding: 20px 24px 28px;
                gap: 16px;
                border-bottom: 1px solid var(--border);
                transform: translateY(-120%);
                opacity: 0;
                transition: all var(--transition);
                pointer-events: none;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            }
            .nav-links.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .hamburger {
                display: flex;
            }
            .theme-toggle {
                margin-left: auto;
                margin-right: 12px;
            }
        }

        @media (max-width: 480px) {
            .post-card h2 {
                font-size: 1.2rem;
            }
            .post-card .excerpt {
                font-size: 0.9rem;
            }
            .sidebar-card {
                padding: 18px 18px;
            }
            .post-detail .detail-title {
                font-size: 1.4rem;
            }
            .footer .socials a {
                font-size: 1.4rem;
            }
            .post-detail .detail-content .poem {
                font-size: 1rem;
                padding: 16px 8px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gap-2 {
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 头部 ===== -->
    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo">📝 杨梓周<span>·博客</span></div>

            <ul class="nav-links" id="navLinks">
                <li><a href="#" data-page="home" class="active">首页</a></li>
                <li><a href="#" data-page="about">关于</a></li>
                <li><a href="#" data-page="archive">归档</a></li>

            </button>
            <button class="hamburger" id="hamburger" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>

    </header>

    <!-- ===== 主容器 ===== -->
    <div class="container" id="app">

        <!-- ===== 主要内容 ===== -->
        <main class="main-content" id="mainContent">

            <!-- 页面标题 -->
            <div id="pageHeader">

            <div class="sidebar-card">

            <!-- 近期文章 -->

    </div>

    <!-- ===== 底部 ===== -->
    <footer class="footer">
        <div class="socials">

            </a>
            <a href="https://www.xiaohongshu.com/user/profile/6461f9a90000000012036e1c" target="_blank" aria-label="小红书">
                <i class="fab fa-xiaohongshu"></i>
            </a>
            <a href="https://www.zhihu.com/people/1-42-16-2-11" target="_blank" aria-label="知乎">
                <i class="fab fa-zhihu"></i>
            </a>
        </div>
        <p>&copy; 2026 杨梓周 · 走读生的帅，你根本想象不到</p>

    <script>

            <a href="#" data-id="${p.id}" style="font-size:0.92rem;color:var(--text-secondary);transition:color var(--transition);">
              ${p.title}
              <span style="display:block;font-size:0.75rem;color:var(--text-muted);">${formatDate(p.date)}</span>
            </a>
          `).join('');

            recentListEl.querySelectorAll('a[data-id]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(a.dataset.id);
                    openPost(id);
                });
            });
        }

        function applyFilters() {
            let result = [...state.posts];

            if (state.selectedCategory) {
                result = result.filter(p => p.category === state.selectedCategory);
            }

            if (state.selectedTag) {
                result = result.filter(p => p.tags.includes(state.selectedTag));
            }

            if (state.searchQuery.trim()) {
                const q = state.searchQuery.trim().toLowerCase();
                result = result.filter(p =>
                    p.title.toLowerCase().includes(q) ||
                    p.tags.some(t => t.toLowerCase().includes(q)) ||
                    p.category.toLowerCase().includes(q)
                );
            }

            state.filteredPosts = result;
            state.currentPage = 1;
            renderPosts();
            renderSidebar();

            let title = '📖 我的文章';
            let subtitle = '记录走读生的日常与思考';
            if (state.selectedCategory) {
                title = `📂 ${state.selectedCategory}`;
                subtitle = `共 ${result.length} 篇文章`;
            } else if (state.selectedTag) {
                title = `🏷️ ${state.selectedTag}`;
                subtitle = `共 ${result.length} 篇文章`;
            } else if (state.searchQuery.trim()) {
                title = `🔍 搜索: "${state.searchQuery.trim()}"`;
                subtitle = `找到 ${result.length} 篇文章`;
            }
            pageTitle.textContent = title;
            pageSubtitle.textContent = subtitle;
        }

        // ============================================================
        //  导航切换
        // ============================================================
        function navigateTo(page) {
            closeDetail();
            state.selectedCategory = null;
            state.selectedTag = null;
            state.searchQuery = '';
            searchInput.value = '';
            state.currentPage = 1;
            state.filteredPosts = [...state.posts];

            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });

            if (page === 'home') {
                pageTitle.textContent = '📖 我的文章';
                pageSubtitle.textContent = '记录走读生的日常与思考';
                applyFilters();
            } else if (page === 'about') {
                pageTitle.textContent = '👤 关于我';
                pageSubtitle.textContent = '一个走读生，热爱记录生活';
                postListEl.innerHTML = `
              <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 36px;box-shadow:var(--shadow);">
                <p style="font-size:1.1rem;line-height:1.8;color:var(--text-secondary);">
                  你好！我是 <strong style="color:var(--text);">杨梓周</strong>，一名走读生，喜欢用文字记录日常里那些闪光的小瞬间。
                </p>
                <p style="font-size:1rem;line-height:1.8;color:var(--text-secondary);margin-top:16px;">
                  🚲 走读日常 · 观察生活 · 偶尔思考<br />
                  ✍️ 相信 <strong>「生活里的帅，是活出来的」</strong>
                </p>
                <p style="font-size:1rem;line-height:1.8;color:var(--text-secondary);margin-top:16px;">
                  这个博客就是我的小角落，记录那些风里来雨里去的日子，以及路上的风景与心情。
                </p>
                <p style="font-size:1rem;line-height:1.8;color:var(--text-secondary);margin-top:16px;">
                  📬 联系我：<a href="mailto:yangzizhou2026@outlook.com">yangzizhou2026@outlook.com</a>
                </p>
              </div>
            `;
                paginationEl.innerHTML = '';
                document.querySelector('.search-box').style.display = 'none';
                document.querySelector('#pageHeader').style.display = 'block';
            } else if (page === 'archive') {
                pageTitle.textContent = '📚 全部归档';
                pageSubtitle.textContent = `共 ${state.posts.length} 篇文章 · 按时间排列`;
                const sorted = [...state.posts].sort((a, b) => new Date(b.date) - new Date(a.date));
                postListEl.innerHTML = sorted.map(p => `
              <div class="post-card" data-id="${p.id}" style="cursor:pointer;">
                <div class="post-meta">
                  <span>📅 ${formatDate(p.date)}</span>
                  <span>📂 ${p.category}</span>
                  <span class="tag">${p.tags.join(' · ')}</span>
                </div>
                <h2><a href="#" data-id="${p.id}">${p.title}</a></h2>
              </div>
            `).join('');
                paginationEl.innerHTML = '';
                document.querySelector('.search-box').style.display = 'none';
                document.querySelector('#pageHeader').style.display = 'block';

                postListEl.querySelectorAll('.post-card').forEach(el => {
                    const id = parseInt(el.dataset.id);
                    el.addEventListener('click', () => openPost(id));
                });
                postListEl.querySelectorAll('a[data-id]').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = parseInt(a.dataset.id);
                        openPost(id);
                    });
                });
            }

            closeMobileMenu();
        }

        // ============================================================
        //  移动端菜单
        // ============================================================
        function closeMobileMenu() {
            navLinksContainer.classList.remove('open');
            hamburger.classList.remove('open');
        }

        hamburger.addEventListener('click', () => {
            navLinksContainer.classList.toggle('open');
            hamburger.classList.toggle('open');
        });

        // ============================================================
        //  主题切换
        // ============================================================
        function getTheme() {
            return localStorage.getItem('theme') || 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        setTheme(getTheme());

        // ============================================================
        //  搜索
        // ============================================================
        searchInput.addEventListener('input', () => {
            state.searchQuery = searchInput.value;
            state.currentPage = 1;
            applyFilters();
        });

        // ============================================================
        //  路由 (hash)
        // ============================================================
        function handleHash() {
            const hash = window.location.hash;
            if (hash.startsWith('#post-')) {
                const id = parseInt(hash.replace('#post-', ''));
                if (!isNaN(id)) {
                    const post = state.posts.find(p => p.id === id);
                    if (post) {
                        renderDetail(post);
                        postListEl.style.display = 'none';
                        paginationEl.style.display = 'none';
                        document.querySelector('.search-box').style.display = 'none';
                        document.querySelector('#pageHeader').style.display = 'none';
                        return;
                    }
                }
            }
            if (state.view === 'list') {
                postListEl.style.display = 'block';
                paginationEl.style.display = 'flex';
                document.querySelector('.search-box').style.display = 'flex';
                document.querySelector('#pageHeader').style.display = 'block';
            }
        }

        window.addEventListener('hashchange', handleHash);

        // ============================================================
        //  Back 按钮
        // ============================================================
        backBtn.addEventListener('click', () => {
            closeDetail();
            const activeNav = document.querySelector('.nav-links a.active');
            if (activeNav) {
                navigateTo(activeNav.dataset.page);
            } else {
                applyFilters();
            }
        });

        // ============================================================
        //  导航点击
        // ============================================================
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.dataset.page;
                navigateTo(page);
            });
        });

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            state.filteredPosts = [...state.posts];
            renderPosts();
            renderSidebar();
            handleHash();
            if (state.view === 'list') {
                postListEl.style.display = 'block';
                paginationEl.style.display = 'flex';
                document.querySelector('.search-box').style.display = 'flex';
                document.querySelector('#pageHeader').style.display = 'block';
            }
        }

        init();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.view === 'detail') {
                closeDetail();
                const activeNav = document.querySelector('.nav-links a.active');
                if (activeNav) {
                    navigateTo(activeNav.dataset.page);
                } else {
                    applyFilters();
                }
            }
        });

        console.log('✨ 杨梓周的博客已加载 · 走读生的帅，你根本想象不到！');
    </script>
</body>
</html>
