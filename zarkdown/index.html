<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarkdown 在线体验</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
  }
  #left {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #313244;
  }
  #right {
    flex: 1;
    background: #ffffff;
    overflow-y: auto;
    color: #1e1e2e;
  }
  .toolbar {
    padding: 10px 15px;
    background: #313244;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .toolbar .title { font-weight: 600; }
  .toolbar .status { font-size: 12px; color: #6c7086; }
  .toolbar .status.loading { color: #f9e2af; }
  .toolbar .status.ready { color: #a6e3a1; }
  .toolbar .status.error { color: #f38ba8; }
  textarea {
    flex: 1;
    padding: 20px;
    font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
    font-size: 14px;
    line-height: 1.6;
    background: #1e1e2e;
    color: #cdd6f4;
    border: none;
    outline: none;
    resize: none;
    tab-size: 2;
  }
  #preview {
    padding: 30px 40px;
    max-width: 800px;
    margin: 0 auto;
    line-height: 1.7;
  }
  #preview h1 { border-bottom: 2px solid #eee; padding-bottom: 0.3em; margin-top: 1.2em; }
  #preview h1, #preview h2, #preview h3, #preview h4 { margin-top: 1.2em; margin-bottom: 0.4em; }
  #preview blockquote {
    border-left: 4px solid #4a90d9;
    padding: 0.6em 1em;
    margin: 1em 0;
    background: #f0f4ff;
    border-radius: 0 4px 4px 0;
    color: #2c3e50;
  }
  #preview pre {
    background: #f6f8fa;
    padding: 14px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #preview code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.9em;
  }
  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
  }
  #preview th, #preview td {
    border: 1px solid #ddd;
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  #preview th { background: #f2f2f2; font-weight: 600; }
  #preview tr:nth-child(even) td { background: #f9f9f9; }
  #preview hr { border: none; border-top: 2px dashed #ccc; margin: 2em 0; }
  #preview img { max-width: 100%; height: auto; }
  #preview sup {
    background: #eee;
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-size: 0.75em;
    cursor: help;
  }
  .toolbar button {
    background: #89b4fa;
    border: none;
    color: #1e1e2e;
    padding: 5px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 8px;
  }
  .toolbar button:hover { background: #b4befe; }
</style>
</head>
<body>
  <div id="left">
    <div class="toolbar">
      <span class="title">📝 Zarkdown 在线体验</span>
      <div>
        <span id="status" class="status loading">正在加载 Pyodide...</span>
        <button onclick="loadExample()">示例</button>
      </div>
    </div>
    <textarea id="source" spellcheck="false" placeholder="在此输入 Zarkdown 代码..."></textarea>
  </div>
  <div id="right">
    <div id="preview"></div>
  </div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
const source = document.getElementById('source');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');

let pyodide = null;

const EXAMPLE = `/ Zarkdown 在线体验

?恭喜?，你正在浏览器里运行 Zarkdown！

这里有一个链接：*点击访问*(https://github.com/yangzizhoudiwuxuande/zarkdown)

~python
print("Hello Zarkdown!")
~

| 特性 | 支持 |
------
| 标题 | ✅ |
------
| 粗体 | ✅ |

! 无序列表第一项
! 无序列表第二项

| 这是一段引用文字
`;

async function init() {
  try {
    statusEl.textContent = '正在加载 Pyodide...';
    pyodide = await loadPyodide();

    statusEl.textContent = '正在准备运行环境...';

    // 注入假的 webbrowser 模块，避免 core.py 里的 import webbrowser 失败
    pyodide.runPython(`
import sys, types
fake_wb = types.ModuleType('webbrowser')
fake_wb.open = lambda *a, **kw: None
sys.modules['webbrowser'] = fake_wb
`);

    statusEl.textContent = '正在加载 Zarkdown 核心...';

    const resp = await fetch('https://raw.githubusercontent.com/yangzizhoudiwuxuande/zarkdown/main/src/zarkdown/core.py');
    if (!resp.ok) throw new Error('无法加载 core.py：' + resp.status);
    let coreCode = await resp.text();

    // 剥离末尾的 if __name__ == "__main__": main()
    const mainBlockStart = coreCode.indexOf('if __name__');
    if (mainBlockStart !== -1) {
      coreCode = coreCode.slice(0, mainBlockStart);
    }

    // 把代码写进一个真正的模块，确保函数进入全局命名空间
    pyodide.runPython(`
import types as _types
_zk_mod = _types.ModuleType('_zk_mod')
exec(${JSON.stringify(coreCode)}, _zk_mod.__dict__)
zarkdown_to_html = _zk_mod.zarkdown_to_html
`);

    // 验证函数已定义
    const hasFn = pyodide.runPython('callable(globals().get("zarkdown_to_html"))');
    if (!hasFn) {
      throw new Error('zarkdown_to_html 未定义');
    }

    statusEl.textContent = '✅ 就绪';
    statusEl.className = 'status ready';
    loadExample();
  } catch (e) {
    statusEl.textContent = '❌ 加载失败: ' + e.message;
    statusEl.className = 'status error';
    console.error(e);
  }
}

function convert() {
  if (!pyodide) return;
  const text = source.value;
  try {
    pyodide.globals.set('input_text', text);
    const html = pyodide.runPython('zarkdown_to_html(input_text)');
    preview.innerHTML = html;
  } catch (e) {
    preview.innerHTML = '<pre style="color:#f38ba8;">' + e.message + '</pre>';
  }
}

function loadExample() {
  source.value = EXAMPLE;
  convert();
}

let timer;
source.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(convert, 300);
});

init();
</script>
</body>
</html>
