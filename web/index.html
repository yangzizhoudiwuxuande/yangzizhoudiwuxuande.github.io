<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebOS · 网页操作系统</title>
<style>
/* ==================== 基础 ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #4f7cff;
  --bar-h: 48px;
  --win-bg: rgba(28, 30, 38, 0.94);
  --win-bg2: rgba(38, 41, 52, 0.94);
  --text: #e8eaf0;
  --text-dim: #98a2b3;
  --wall: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #43276b 100%);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
  user-select: none;
  background: #000;
}

input, textarea { user-select: text; font-family: inherit; }

button { font-family: inherit; cursor: pointer; }

/* ==================== 桌面 ==================== */
#desktop {
  position: fixed;
  inset: 0 0 var(--bar-h) 0;
  background: var(--wall);
  background-size: cover;
  overflow: hidden;
  transition: background .4s;
}

#desktop::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 60%);
  pointer-events: none;
}

#icons {
  position: absolute;
  inset: 0;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 92px);
  grid-auto-rows: 98px;
  align-content: start;
  gap: 4px;
  z-index: 1;
}

.desk-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 4px;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
  transition: background .12s;
  border: 1px solid transparent;
}

.desk-icon:hover { background: rgba(255,255,255,.12); }
.desk-icon.selected { background: rgba(79,124,255,.35); border-color: rgba(255,255,255,.35); }
.desk-icon .glyph { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
.desk-icon .label { font-size: 12px; text-align: center; word-break: break-all; line-height: 1.3; }

/* ==================== 窗口 ==================== */
#windows { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

.window {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--win-bg);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  overflow: hidden;
  min-width: 260px;
  min-height: 150px;
  pointer-events: auto;
  animation: winIn .16s ease-out;
  transition: box-shadow .15s, border-color .15s;
}

@keyframes winIn {
  from { opacity: 0; transform: scale(.965) translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.window.active {
  border-color: rgba(255,255,255,.28);
  box-shadow: 0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(79,124,255,.35);
}

.window.maxed { border-radius: 0; }

.titlebar {
  height: 36px;
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 6px 0 12px;
  background: linear-gradient(to bottom, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border-bottom: 1px solid rgba(255,255,255,.08);
  cursor: default;
}

.t-ico { font-size: 15px; }
.t-title { flex: 1; font-size: 13px; color: #dfe4ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.t-btns { display: flex; gap: 2px; }

.wbtn {
  width: 30px; height: 24px;
  border: none;
  background: transparent;
  color: #b8c0d0;
  border-radius: 5px;
  font-size: 13px;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: background .12s, color .12s;
}
.wbtn:hover { background: rgba(255,255,255,.14); color: #fff; }
.wbtn.close:hover { background: #e5484d; color: #fff; }

.win-body {
  flex: 1;
  overflow: auto;
  position: relative;
  font-size: 13px;
}

.win-body::-webkit-scrollbar { width: 10px; height: 10px; }
.win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
.win-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }

.resizer {
  position: absolute;
  right: 0; bottom: 0;
  width: 16px; height: 16px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.35) 50%);
  border-bottom-right-radius: 10px;
  opacity: .5;
}
.resizer:hover { opacity: 1; }

/* ==================== 任务栏 ==================== */
#taskbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  background: rgba(16, 18, 24, .82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid rgba(255,255,255,.09);
  z-index: 90000;
}

#startBtn {
  height: 34px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  border: none;
  border-radius: 7px;
  background: rgba(255,255,255,.08);
  color: #e8eaf0;
  font-size: 13px;
  font-weight: 500;
  transition: background .12s;
}
#startBtn:hover { background: rgba(255,255,255,.18); }
#startBtn.open { background: var(--accent); color: #fff; }
#startBtn .logo { color: var(--accent); font-size: 15px; }
#startBtn.open .logo { color: #fff; }

#tasks {
  flex: 1;
  display: flex;
  gap: 4px;
  overflow: hidden;
}

.task-item {
  height: 34px;
  max-width: 180px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: rgba(255,255,255,.05);
  color: #c6ccd8;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  transition: background .12s;
}
.task-item:hover { background: rgba(255,255,255,.14); }
.task-item.active {
  background: rgba(79,124,255,.22);
  border-color: rgba(79,124,255,.5);
  color: #fff;
}
.task-item .tl { overflow: hidden; text-overflow: ellipsis; }

#tray {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  font-size: 12px;
  color: #c6ccd8;
  font-variant-numeric: tabular-nums;
}

/* ==================== 开始菜单 ==================== */
#startMenu {
  position: fixed;
  left: 8px;
  bottom: calc(var(--bar-h) + 8px);
  width: 340px;
  padding: 14px;
  background: rgba(22, 24, 32, .95);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 12px;
  box-shadow: 0 24px 70px rgba(0,0,0,.65);
  display: none;
  z-index: 95000;
}
#startMenu.show { display: block; animation: winIn .15s ease-out; }

.sm-head {
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-left: 2px;
}

.sm-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.sm-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border: none;
  background: transparent;
  border-radius: 8px;
  color: #d6dbe6;
  font-size: 11px;
  transition: background .12s;
}
.sm-app:hover { background: rgba(255,255,255,.12); }
.sm-app .glyph { font-size: 24px; line-height: 1; }

.sm-foot {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
}

/* ==================== 通用组件 ==================== */
.btn {
  height: 26px;
  padding: 0 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 6px;
  background: rgba(255,255,255,.07);
  color: #d6dbe6;
  font-size: 12px;
  transition: background .12s;
}
.btn:hover { background: rgba(255,255,255,.16); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.12); }

.grow { flex: 1; }

/* ==================== 记事本 ==================== */
.app-notepad { display: flex; flex-direction: column; height: 100%; }
.pad-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  background: rgba(0,0,0,.18);
  border-bottom: 1px solid rgba(255,255,255,.07);
  flex: 0 0 auto;
}
.pad-bar .btn { height: 24px; padding: 0 9px; font-size: 12px; }
.pad-info { font-size: 11px; color: var(--text-dim); padding-right: 4px; }
.app-notepad textarea {
  flex: 1;
  width: 100%;
  padding: 12px 14px;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: #e8eaf0;
  font-size: 13px;
  line-height: 1.65;
  font-family: "Consolas", "Menlo", monospace;
}

/* ==================== 计算器 ==================== */
.calc { display: flex; flex-direction: column; height: 100%; }
.calc-screen {
  flex: 0 0 auto;
  padding: 14px 18px 12px;
  text-align: right;
  background: rgba(0,0,0,.28);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.calc-expr { font-size: 12px; color: var(--text-dim); height: 17px; overflow: hidden; white-space: nowrap; }
.calc-res { font-size: 30px; font-weight: 600; letter-spacing: .5px; overflow: hidden; white-space: nowrap; }
.calc-keys {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px;
}
.calc-keys button {
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  color: #e8eaf0;
  font-size: 16px;
  transition: background .1s, transform .06s;
}
.calc-keys button:hover { background: rgba(255,255,255,.17); }
.calc-keys button:active { transform: scale(.95); }
.calc-keys button.op { background: rgba(79,124,255,.3); color: #cfdcff; }
.calc-keys button.op:hover { background: rgba(79,124,255,.48); }
.calc-keys button.eq { background: var(--accent); color: #fff; }
.calc-keys button.fn { background: rgba(255,255,255,.05); color: #a9b3c6; font-size: 14px; }

/* ==================== 终端 ==================== */
.term {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 10px 12px;
  font-family: "Consolas", "Menlo", "Courier New", monospace;
  font-size: 12.5px;
  line-height: 1.6;
  background: rgba(8, 10, 16, .55);
}
.term-out { flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.term-row { color: #cdd6e4; }
.term-row.cmd { color: #7ee2a8; }
.term-row.err { color: #ff7b72; }
.term-inputline { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; padding-top: 4px; }
.term-prompt { color: #7ee2a8; white-space: nowrap; }
.term-in {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: #e8eaf0;
  font-family: inherit;
  font-size: inherit;
}

/* ==================== 文件管理器 ==================== */
.fm { display: flex; flex-direction: column; height: 100%; }
.fm-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  background: rgba(0,0,0,.18);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.fm-path {
  flex: 1;
  font-size: 12px;
  color: var(--text-dim);
  font-family: monospace;
  background: rgba(0,0,0,.25);
  border-radius: 5px;
  padding: 4px 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fm-list {
  flex: 1;
  overflow: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 88px);
  grid-auto-rows: 88px;
  align-content: start;
  gap: 6px;
}
.fm-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .1s;
}
.fm-item:hover { background: rgba(255,255,255,.1); }
.fm-ico { font-size: 28px; line-height: 1; }
.fm-name { font-size: 11px; text-align: center; color: #d6dbe6; word-break: break-all; padding: 0 4px; }
.fm-empty { color: var(--text-dim); font-size: 12px; grid-column: 1 / -1; padding: 20px; text-align: center; }

/* ==================== 设置 ==================== */
.settings { padding: 18px 20px; }
.settings h3 {
  font-size: 12px; font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 0 0 10px;
}
.settings h3:not(:first-child) { margin-top: 24px; }
.wall-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.wall-item {
  height: 54px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .12s, border-color .12s;
}
.wall-item:hover { transform: scale(1.04); }
.wall-item.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,124,255,.25); }
.accent-list { display: flex; gap: 10px; flex-wrap: wrap; }
.accent-item {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .12s;
}
.accent-item:hover { transform: scale(1.12); }
.accent-item.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.2); }

/* ==================== 画板 ==================== */
.paint { display: flex; flex-direction: column; height: 100%; }
.paint-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  background: rgba(0,0,0,.18);
  border-bottom: 1px solid rgba(255,255,255,.07);
  flex: 0 0 auto;
}
.paint-bar input[type="color"] {
  width: 32px; height: 26px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 6px;
  background: transparent;
  padding: 1px;
  cursor: pointer;
}
.paint-bar input[type="range"] { width: 110px; accent-color: var(--accent); cursor: pointer; }
.paint-wrap { flex: 1; overflow: hidden; display: grid; place-items: center; background: #fff; }
.paint-wrap canvas { max-width: 100%; max-height: 100%; display: block; cursor: crosshair; touch-action: none; }

/* ==================== 时钟 ==================== */
.clock-app {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  background: radial-gradient(circle at 50% 30%, rgba(79,124,255,.22), transparent 65%);
}
.clock-time {
  font-size: 52px;
  font-weight: 300;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 4px 24px rgba(79,124,255,.5);
}
.clock-date { font-size: 14px; color: var(--text-dim); }

/* ==================== 贪吃蛇 ==================== */
.snake { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 8px; }
.snake-hud { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
.snake-score { color: #7ee2a8; font-weight: 600; }
.snake canvas {
  width: 100%;
  height: auto;
  border-radius: 8px;
  display: block;
  background: #111827;
}
</style>
</head>
<body>

<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
</div>

<div id="taskbar">
  <button id="startBtn"><span class="logo">◆</span><span>开始</span></button>
  <div id="tasks"></div>
  <div id="tray"><span id="trayClock"></span></div>
</div>

<div id="startMenu">
  <div class="sm-head">所有应用</div>
  <div id="smGrid" class="sm-grid"></div>
  <div class="sm-foot">WebOS v1.0 · 纯 HTML / CSS / JavaScript</div>
</div>

<script>
/* =========================================================
   0. 工具函数
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* =========================================================
   1. 虚拟文件系统（终端与文件管理器共用）
   ========================================================= */
const FS = {
  type: 'dir',
  children: {
    home: {
      type: 'dir',
      children: {
        guest: {
          type: 'dir',
          children: {
            'readme.txt': {
              type: 'file',
              content:
                '欢迎使用 WebOS！\n' +
                '====================\n\n' +
                '这是一个完全由 HTML / CSS / JavaScript 构建的\n' +
                '网页操作系统演示。\n\n' +
                '小贴士：\n' +
                ' · 双击桌面图标可以打开应用\n' +
                ' · 拖动标题栏移动窗口，拖动右下角调整大小\n' +
                ' · 双击标题栏可以最大化\n' +
                ' · 点击任务栏按钮可以最小化 / 还原窗口\n' +
                ' · 在终端里输入 help 查看所有命令\n'
            },
            'todo.txt': {
              type: 'file',
              content: '□ 给终端增加更多命令\n□ 让窗口支持吸附\n□ 写一个音乐播放器\n'
            },
            projects: {
              type: 'dir',
              children: {
                'hello.html': {
                  type: 'file',
                  content: '<!DOCTYPE html>\n<html>\n  <body>\n    <h1>Hello, WebOS!</h1>\n  </body>\n</html>\n'
                }
              }
            }
          }
        }
      }
    },
    etc: {
      type: 'dir',
      children: {
        motd: { type: 'file', content: 'WebOS 1.0 — Have fun!\n' }
      }
    },
    tmp: { type: 'dir', children: {} }
  }
};

function normalizePath(p, cwd = '/') {
  const raw = p.startsWith('/') ? p : cwd + '/' + p;
  const parts = [];
  for (const seg of raw.split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop();
    else parts.push(seg);
  }
  return '/' + parts.join('/');
}

function getNode(path) {
  if (path === '/' || path === '') return FS;
  let node = FS;
  for (const seg of path.split('/').filter(Boolean)) {
    if (!node.children || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}

function getParent(path) {
  const norm = normalizePath(path);
  if (norm === '/') return null;
  const parentPath = norm.replace(/\/[^/]+$/, '') || '/';
  return { parent: getNode(parentPath), name: norm.split('/').pop() };
}

/* =========================================================
   2. 窗口管理器
   ========================================================= */
const winList = [];
let zTop = 10;
let winSeq = 0;

function focusWin(w) {
  if (!w || !w.el.isConnected) return;
  w.el.style.zIndex = ++zTop;
  winList.forEach(x => {
    const on = x === w;
    x.el.classList.toggle('active', on);
    if (x.taskEl) x.taskEl.classList.toggle('active', on && !x.minimized);
  });
}

function startDrag(w, e) {
  if (w.maximized) return;
  const el = w.el;
  const desktop = $('#desktop');
  const sx = e.clientX, sy = e.clientY;
  const sl = el.offsetLeft, st = el.offsetTop;
  const dw = desktop.clientWidth, dh = desktop.clientHeight;

  el.style.transition = 'none';

  const onMove = (ev) => {
    const nl = clamp(sl + ev.clientX - sx, -el.offsetWidth + 120, dw - 90);
    const nt = clamp(st + ev.clientY - sy, 0, dh - 36);
    el.style.left = nl + 'px';
    el.style.top = nt + 'px';
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    el.style.transition = '';
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function initResize(w) {
  const handle = w.el.querySelector('.resizer');
  handle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    focusWin(w);
    const el = w.el;
    const sx = e.clientX, sy = e.clientY;
    const sw = el.offsetWidth, sh = el.offsetHeight;

    const onMove = (ev) => {
      el.style.width = Math.max(280, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(160, sh + ev.clientY - sy) + 'px';
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });
}

function minimizeWin(w) {
  w.minimized = true;
  w.el.style.display = 'none';
  w.el.classList.remove('active');
  if (w.taskEl) w.taskEl.classList.remove('active');
}

function restoreWin(w) {
  w.minimized = false;
  w.el.style.display = 'flex';
}

function toggleMax(w) {
  const el = w.el;
  if (w.maximized) {
    w.maximized = false;
    el.classList.remove('maxed');
    el.style.left = w.prev.left + 'px';
    el.style.top = w.prev.top + 'px';
    el.style.width = w.prev.w + 'px';
    el.style.height = w.prev.h + 'px';
  } else {
    w.prev = { left: el.offsetLeft, top: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    w.maximized = true;
    el.classList.add('maxed');
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = '100%';
    el.style.height = '100%';
  }
  focusWin(w);
}

function closeWin(w) {
  if (w.onClose) { try { w.onClose(); } catch (e) {} }
  w.el.remove();
  if (w.taskEl) w.taskEl.remove();
  const i = winList.indexOf(w);
  if (i >= 0) winList.splice(i, 1);
  // 焦点交给最上层窗口
  const next = winList.filter(x => !x.minimized).sort((a, b) => (+a.el.style.zIndex || 0) - (+b.el.style.zIndex || 0)).pop();
  if (next) focusWin(next);
}

function openApp(appId, arg) {
  const app = APPS[appId];
  if (!app) { console.warn('未知应用:', appId); return null; }

  const id = 'w' + (++winSeq);
  const width = app.width || 600;
  const height = app.height || 420;

  const desktop = $('#desktop');
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  const n = winList.length % 8;
  const left = Math.max(12, Math.min(dw - width - 12, 48 + n * 28));
  const top = Math.max(12, Math.min(dh - height - 12, 34 + n * 26));

  const el = document.createElement('div');
  el.className = 'window active';
  el.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${++zTop}`;
  el.innerHTML = `
    <div class="titlebar">
      <span class="t-ico">${app.icon}</span>
      <span class="t-title">${app.name}</span>
      <div class="t-btns">
        <button class="wbtn min" title="最小化">—</button>
        <button class="wbtn max" title="最大化">▢</button>
        <button class="wbtn close" title="关闭">✕</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="resizer"></div>`;
  $('#windows').appendChild(el);

  const body = el.querySelector('.win-body');
  const w = { id, appId, el, body, minimized: false, maximized: false, prev: null, taskEl: null, onClose: null };
  winList.push(w);

  // 任务栏按钮
  const taskEl = document.createElement('button');
  taskEl.className = 'task-item active';
  taskEl.innerHTML = `<span class="ti">${app.icon}</span><span class="tl">${app.name}</span>`;
  taskEl.title = app.name;
  taskEl.addEventListener('click', () => {
    if (w.minimized) { restoreWin(w); focusWin(w); }
    else if (el.classList.contains('active')) minimizeWin(w);
    else focusWin(w);
  });
  $('#tasks').appendChild(taskEl);
  w.taskEl = taskEl;

  // 窗口事件
  const titlebar = el.querySelector('.titlebar');
  titlebar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.wbtn')) return;
    focusWin(w);
    startDrag(w, e);
  });
  titlebar.addEventListener('dblclick', (e) => {
    if (!e.target.closest('.wbtn')) toggleMax(w);
  });
  el.addEventListener('pointerdown', () => focusWin(w), true);

  el.querySelector('.min').addEventListener('click', (e) => { e.stopPropagation(); minimizeWin(w); });
  el.querySelector('.max').addEventListener('click', (e) => { e.stopPropagation(); toggleMax(w); });
  el.querySelector('.close').addEventListener('click', (e) => { e.stopPropagation(); closeWin(w); });

  initResize(w);
  focusWin(w);

  try {
    app.mount(body, w, arg);
  } catch (err) {
    console.error(err);
    body.innerHTML = `<div style="padding:20px;color:#ff7b72;font-family:monospace">应用启动失败：${err.message}</div>`;
  }

  return w;
}

APPS.calc = {
  name: '计算器', icon: '🧮', width: 300, height: 420,
  mount(body) {
    body.innerHTML = `
      <div class="calc">
        <div class="calc-screen">
          <div class="calc-expr"></div>
          <div class="calc-res">0</div>
        </div>
        <div class="calc-keys"></div>
      </div>`;

    const exprEl = body.querySelector('.calc-expr');
    const resEl = body.querySelector('.calc-res');
    const keysEl = body.querySelector('.calc-keys');

    const KEYS = [
      { t: 'C',  v: 'clear', cls: 'fn' },
      { t: '±',  v: 'neg',   cls: 'fn' },
      { t: '%',  v: '%',     cls: 'fn' },
      { t: '÷',  v: '/',     cls: 'op' },
      { t: '7',  v: '7' }, { t: '8', v: '8' }, { t: '9', v: '9' },
      { t: '×',  v: '*', cls: 'op' },
      { t: '4',  v: '4' }, { t: '5', v: '5' }, { t: '6', v: '6' },
      { t: '−',  v: '-', cls: 'op' },
      { t: '1',  v: '1' }, { t: '2', v: '2' }, { t: '3', v: '3' },
      { t: '+',  v: '+', cls: 'op' },
      { t: '(',  v: '(', cls: 'fn' },
      { t: '0',  v: '0' },
      { t: '.',  v: '.' },
      { t: ')',  v: ')', cls: 'fn' },
      { t: '=',  v: '=', cls: 'eq' }
    ];

    let expr = '';

    function evalExpr(s) {
      const clean = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      if (!/^[0-9+\-*/().%\s]+$/.test(clean)) throw new Error('invalid');
      const val = Function('"use strict"; return (' + clean + ')')();
      if (typeof val !== 'number' || !isFinite(val)) throw new Error('invalid');
      return Math.round(val * 1e10) / 1e10;
    }

    function render(preview) {
      exprEl.textContent = expr || ' ';
      if (!expr) { resEl.textContent = '0'; return; }
      try {
        const v = evalExpr(expr);
        resEl.textContent = preview ? String(v) : (expr.match(/[0-9.]+$/) || [''])[0].slice(-14) || '0';
      } catch {
        resEl.textContent = '—';
      }
    }

    function press(v) {
      if (v === 'clear') { expr = ''; render(); return; }
      if (v === 'neg') {
        // 简单处理：把整个表达式取负
        expr = expr ? '-(' + expr + ')' : '-';
        render(); return;
      }
      if (v === '=') {
        if (!expr) return;
        try {
          const v2 = evalExpr(expr);
          expr = String(v2);
          exprEl.textContent = ' ';
          resEl.textContent = expr;
        } catch {
          resEl.textContent = '错误';
          expr = '';
        }
        return;
      }
      expr += v;
      try {
        const v3 = evalExpr(expr);
        exprEl.textContent = expr;
        resEl.textContent = String(v3);
      } catch {
        exprEl.textContent = expr;
      }
    }

    KEYS.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k.t;
      if (k.cls) b.className = k.cls;
      b.addEventListener('click', () => press(k.v));
      keysEl.appendChild(b);
    });

    // 键盘支持（窗口激活时）
    const onKey = (e) => {
      if (!body.closest('.window').classList.contains('active')) return;
      const map = {
        '/': '/', '*': '*', '-': '-', '+': '+', '.': '.',
        '(': '(', ')': ')', '%': '%',
        'Enter': '=', '=': '=',
        'Escape': 'clear', 'Backspace': 'back'
      };
      if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); return; }
      if (e.key === 'Backspace') { expr = expr.slice(0, -1); render(); e.preventDefault(); return; }
      if (map[e.key] !== undefined) { press(map[e.key]); e.preventDefault(); }
    };
    window.addEventListener('keydown', onKey);
    setTimeout(() => window.removeEventListener('keydown', onKey), 0);
    // 用一个 window 级监听并配合激活判断即可，无需移除
    render();
  }
};

const CMDS = {
  help: () => [
    '可用命令：',
    '  help              显示帮助',
    '  ls [路径]          列出目录内容',
    '  cd <路径>          切换目录',
    '  pwd               显示当前路径',
    '  cat <文件>         查看文件内容',
    '  echo <文本>        输出文本',
    '  mkdir <名称>       创建目录',
    '  touch <名称>       创建空文件',
    '  rm <名称>          删除文件或空目录',
    '  date              显示当前时间',
    '  whoami            显示当前用户',
    '  open <应用ID>      启动应用（files/notepad/calc/term/paint/clock/snake/settings）',
    '  neofetch          显示系统信息',
    '  clear             清屏'
  ].join('\n'),

  pwd: (args, ctx) => ctx.cwd,

  ls: (args, ctx) => {
    const target = args[0] || '.';
    const p = normalizePath(target, ctx.cwd);
    const node = getNode(p);
    if (!node) return 'ls: ' + target + ': 没有那个文件或目录';
    if (node.type === 'file') return target;
    const names = Object.keys(node.children);
    if (!names.length) return '(空目录)';
    return names
      .sort((a, b) => {
        const ta = node.children[a].type, tb = node.children[b].type;
        if (ta !== tb) return ta === 'dir' ? -1 : 1;
        return a.localeCompare(b);
      })
      .map(n => node.children[n].type === 'dir' ? n + '/' : n)
      .join('   ');
  },

  cd: (args, ctx) => {
    const target = args[0] || '/';
    const p = normalizePath(target, ctx.cwd);
    const node = getNode(p);
    if (!node) return 'cd: ' + target + ': 没有那个目录';
    if (node.type !== 'dir') return 'cd: ' + target + ': 不是目录';
    ctx.cwd = p;
    return '';
  },

  cat: (args, ctx) => {
    if (!args[0]) return '用法: cat <文件>';
    const p = normalizePath(args[0], ctx.cwd);
    const node = getNode(p);
    if (!node) return 'cat: ' + args[0] + ': 没有那个文件';
    if (node.type === 'dir') return 'cat: ' + args[0] + ': 是一个目录';
    return node.content;
  },

  echo: (args) => args.join(' '),

  mkdir: (args, ctx) => {
    if (!args[0]) return '用法: mkdir <名称>';
    const p = normalizePath(args[0], ctx.cwd);
    const par = getParent(p);
    if (!par || !par.parent) return 'mkdir: 路径无效';
    if (par.parent.type !== 'dir') return 'mkdir: 父级不是目录';
    if (par.parent.children[par.name]) return 'mkdir: ' + args[0] + ': 已存在';
    par.parent.children[par.name] = { type: 'dir', children: {} };
    return '';
  },

  touch: (args, ctx) => {
    if (!args[0]) return '用法: touch <名称>';
    const p = normalizePath(args[0], ctx.cwd);
    const par = getParent(p);
    if (!par || !par.parent) return 'touch: 路径无效';
    if (par.parent.type !== 'dir') return 'touch: 父级不是目录';
    if (!par.parent.children[par.name]) {
      par.parent.children[par.name] = { type: 'file', content: '' };
    }
    return '';
  },

  rm: (args, ctx) => {
    if (!args[0]) return '用法: rm <名称>';
    const p = normalizePath(args[0], ctx.cwd);
    const par = getParent(p);
    if (!par || !par.parent) return 'rm: 路径无效';
    const node = par.parent.children[par.name];
    if (!node) return 'rm: ' + args[0] + ': 没有那个文件';
    if (node.type === 'dir' && Object.keys(node.children).length) {
      return 'rm: ' + args[0] + ': 目录非空';
    }
    delete par.parent.children[par.name];
    return '';
  },

  date: () => new Date().toLocaleString('zh-CN'),

  whoami: () => 'guest',

  open: (args) => {
    if (!args[0]) return '用法: open <应用ID>';
    if (!APPS[args[0]]) return 'open: 未知应用 ' + args[0];
    openApp(args[0]);
    return '已启动：' + APPS[args[0]].name;
  },

  neofetch: () => [
    '        ◆◆◆◆        guest@webos',
    '      ◆      ◆      ------------',
    '     ◆   ◆◆   ◆     OS:      WebOS 1.0',
    '     ◆   ◆◆   ◆     Kernel:  JavaScript Engine',
    '      ◆      ◆      Shell:   websh',
    '        ◆◆◆◆        WM:      WebOS Window Manager',
    '                     Res:     ' + window.innerWidth + 'x' + window.innerHeight,
    '                     Theme:   Dark'
  ].join('\n'),

  clear: (args, ctx) => { ctx.clear(); return ''; }
};

function execCommand(line, ctx) {
  const trimmed = line.trim();
  if (!trimmed) return '';
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0];
  const args = parts.slice(1);
  if (!CMDS[cmd]) return 'websh: 未找到命令: ' + cmd + '（输入 help 查看帮助）';
  try {
    return CMDS[cmd](args, ctx);
  } catch (err) {
    return '错误: ' + err.message;
  }
}

APPS.paint = {
  name: '画板', icon: '🎨', width: 680, height: 500,
  mount(body) {
    body.innerHTML = `
      <div class="paint">
        <div class="paint-bar">
          <input type="color" value="#4f7cff">
          <input type="range" min="1" max="30" value="4" title="笔刷大小">
          <button class="btn" data-a="eraser">橡皮擦</button>
          <button class="btn" data-a="clear">清空</button>
          <button class="btn primary" data-a="save">下载 PNG</button>
        </div>
        <div class="paint-wrap"><canvas width="900" height="540"></canvas></div>
      </div>`;

    const canvas = body.querySelector('canvas');
    const g = canvas.getContext('2d');
    const colorInput = body.querySelector('input[type="color"]');
    const sizeInput = body.querySelector('input[type="range"]');

    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.lineCap = 'round';
    g.lineJoin = 'round';

    let drawing = false;
    let erasing = false;
    let last = null;

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * canvas.width / r.width,
        y: (e.clientY - r.top) * canvas.height / r.height
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      last = pos(e);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      g.strokeStyle = erasing ? '#ffffff' : colorInput.value;
      g.lineWidth = erasing ? +sizeInput.value * 2.5 : +sizeInput.value;
      g.beginPath();
      g.moveTo(last.x, last.y);
      g.lineTo(p.x, p.y);
      g.stroke();
      last = p;
    });

    const endDraw = () => { drawing = false; last = null; };
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', endDraw);

    body.querySelector('[data-a="eraser"]').addEventListener('click', (e) => {
      erasing = !erasing;
      e.target.classList.toggle('primary', erasing);
    });

    body.querySelector('[data-a="clear"]').addEventListener('click', () => {
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, canvas.width, canvas.height);
    });

    body.querySelector('[data-a="save"]').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'webos-paint.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  }
};

/* ---------- 3.7 时钟 ---------- */
APPS.clock = {
  name: '时钟', icon: '🕐', width: 380, height: 280,
  mount(body, win) {
    body.innerHTML = `
      <div class="clock-app">
        <div class="clock-time">--:--:--</div>
        <div class="clock-date"></div>
      </div>`;

    const timeEl = body.querySelector('.clock-time');
    const dateEl = body.querySelector('.clock-date');

    const tick = () => {
      if (!body.isConnected) { clearInterval(timer); return; }
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      timeEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      dateEl.textContent = d.toLocaleDateString('zh-CN', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
      });
    };

    const timer = setInterval(tick, 250);
    tick();
    win.onClose = () => clearInterval(timer);
  }
};

/* ---------- 3.8 贪吃蛇 ---------- */
APPS.snake = {
  name: '贪吃蛇', icon: '🐍', width: 380, height: 470,
  mount(body, win) {
    body.innerHTML = `
      <div class="snake">
        <div class="snake-hud">
          <span class="snake-score">得分 0</span>
          <span>方向键控制 · 空格重开</span>
        </div>
        <canvas width="320" height="320"></canvas>
      </div>`;

    const canvas = body.querySelector('canvas');
    const g = canvas.getContext('2d');
    const scoreEl = body.querySelector('.snake-score');

    const CELL = 16;
    const N = 20;

    let snake, dir, nextDir, food, score, dead, timer;

    function randFood() {
      let guard = 0;
      do {
        food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
        guard++;
      } while (guard < 500 && snake.some(s => s.x === food.x && s.y === food.y));
    }

    function reset() {
      snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      dead = false;
      scoreEl.textContent = '得分 0';
      randFood();
      draw();
    }

    function step() {
      if (dead) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true;
        draw();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = '得分 ' + score;
        randFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      g.fillStyle = '#111827';
      g.fillRect(0, 0, canvas.width, canvas.height);

      g.strokeStyle = 'rgba(255,255,255,.045)';
      g.lineWidth = 1;
      for (let i = 1; i < N; i++) {
        g.beginPath(); g.moveTo(i * CELL, 0); g.lineTo(i * CELL, canvas.height); g.stroke();
        g.beginPath(); g.moveTo(0, i * CELL); g.lineTo(canvas.width, i * CELL); g.stroke();
      }

      if (food) {
        g.fillStyle = '#ef4444';
        g.beginPath();
        g.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
        g.fill();
      }

      snake.forEach((s, i) => {
        g.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        g.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
        if (i === 0) {
          g.fillStyle = '#111827';
          const cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
          g.fillRect(cx - 4, cy - 3, 2, 2);
          g.fillRect(cx + 2, cy - 3, 2, 2);
        }
      });

      if (dead) {
        g.fillStyle = 'rgba(0,0,0,.68)';
        g.fillRect(0, 0, canvas.width, canvas.height);
        g.fillStyle = '#ff7b72';
        g.font = 'bold 24px system-ui, sans-serif';
        g.textAlign = 'center';
        g.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 12);
        g.fillStyle = '#e8eaf0';
        g.font = '14px system-ui, sans-serif';
        g.fillText('得分 ' + score + ' · 按空格重开', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function onKey(e) {
      if (!win.el.classList.contains('active')) return;
      const k = e.key;
      if (k === ' ') {
        if (dead) reset();
        e.preventDefault();
        return;
      }
      const dirs = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
      };
      const nd = dirs[k];
      if (nd) {
        if (nd.x === -dir.x && nd.y === -dir.y) return;
        nextDir = nd;
        e.preventDefault();
      }
    }

    window.addEventListener('keydown', onKey);
    win.onClose = () => {
      window.removeEventListener('keydown', onKey);
      clearInterval(timer);
    };

    reset();
    timer = setInterval(step, 130);
  }
};

/* =========================================================
   4. 桌面 / 开始菜单 / 任务栏 初始化
   ========================================================= */
const DESKTOP_APPS = ['files', 'notepad', 'calc', 'term', 'paint', 'clock', 'snake', 'settings'];

function buildDesktop() {
  const wrap = $('#icons');
  wrap.innerHTML = '';
  DESKTOP_APPS.forEach(id => {
    const app = APPS[id];
    if (!app) return;
    const d = document.createElement('div');
    d.className = 'desk-icon';
    d.innerHTML = `<div class="glyph">${app.icon}</div><div class="label"></div>`;
    d.querySelector('.label').textContent = app.name;
    d.addEventListener('click', (e) => {
      e.stopPropagation();
      $$('.desk-icon').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
    });
    d.addEventListener('dblclick', () => {
      d.classList.remove('selected');
      openApp(id);
    });
    wrap.appendChild(d);
  });
}

function buildStartMenu() {
  const grid = $('#smGrid');
  grid.innerHTML = '';
  DESKTOP_APPS.forEach(id => {
    const app = APPS[id];
    if (!app) return;
    const b = document.createElement('button');
    b.className = 'sm-app';
    b.innerHTML = `<span class="glyph">${app.icon}</span><span class="nm"></span>`;
    b.querySelector('.nm').textContent = app.name;
    b.addEventListener('click', () => {
      openApp(id);
      toggleStartMenu(false);
    });
    grid.appendChild(b);
  });
}

function toggleStartMenu(force) {
  const menu = $('#startMenu');
  const btn = $('#startBtn');
  const show = force !== undefined ? force : !menu.classList.contains('show');
  menu.classList.toggle('show', show);
  btn.classList.toggle('open', show);
}

function updateClock() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  $('#trayClock').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}   ${d.getMonth() + 1}/${d.getDate()}`;
}

/* =========================================================
   5. 全局事件绑定
   ========================================================= */
$('#startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleStartMenu();
});

$('#desktop').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'desktop' || e.target.id === 'icons' || e.target.id === 'windows') {
    $$('.desk-icon').forEach(x => x.classList.remove('selected'));
  }
  toggleStartMenu(false);
});

document.addEventListener('pointerdown', (e) => {
  const menu = $('#startMenu');
  if (!menu.classList.contains('show')) return;
  if (e.target.closest('#startMenu') || e.target.closest('#startBtn')) return;
  toggleStartMenu(false);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleStartMenu(false);
});

window.addEventListener('resize', () => {
  const desktop = $('#desktop');
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  winList.forEach(w => {
    if (w.maximized) return;
    const el = w.el;
    const maxL = Math.max(0, dw - el.offsetWidth);
    const maxT = Math.max(0, dh - el.offsetHeight);
    if (el.offsetLeft > maxL) el.style.left = maxL + 'px';
    if (el.offsetTop > maxT) el.style.top = maxT + 'px';
  });
});

/* =========================================================
   6. 启动
   ========================================================= */
(function boot() {
  // 恢复用户偏好
  const wall = localStorage.getItem('webos.wall');
  if (wall) $('#desktop').style.background = wall;
  const accent = localStorage.getItem('webos.accent');
  if (accent) document.documentElement.style.setProperty('--accent', accent);

  buildDesktop();
  buildStartMenu();
  updateClock();
  setInterval(updateClock, 1000);

  // 首次访问的欢迎窗口
  if (!localStorage.getItem('webos.seen')) {
    localStorage.setItem('webos.seen', '1');
    setTimeout(() => {
      openApp('notepad', {
        content:
          '👋 欢迎使用 WebOS！\n\n' +
          '这是一个用纯 HTML / CSS / JavaScript 写成的网页操作系统。\n\n' +
          '你可以试试：\n' +
          '  · 双击桌面上的图标打开应用\n' +
          '  · 拖动标题栏移动窗口，拖动右下角改变大小\n' +
          '  · 双击标题栏最大化窗口\n' +
          '  · 点击任务栏按钮最小化 / 还原\n' +
          '  · 打开终端，输入 help\n' +
          '  · 在设置里换一张壁纸\n\n' +
          '祝你玩得开心！'
      });
    }, 500);
  }
})();
</script>
