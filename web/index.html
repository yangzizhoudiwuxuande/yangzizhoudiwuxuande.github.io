<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebOS · 网页操作系统</title>
<style>
/* ==================== 基础 ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #4f7cff;
  --bar-h: 56px;
  --win-bg: rgba(28, 30, 38, 0.95);
  --win-bg2: rgba(38, 41, 52, 0.95);
  --text: #e8eaf0;
  --text-dim: #98a2b3;
  --wall: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #43276b 100%);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
  user-select: none;
  background: #000;
}

input, textarea { user-select: text; font-family: inherit; }
button { font-family: inherit; cursor: pointer; }

/* ==================== 桌面 ==================== */
#desktop {
  position: fixed;
  inset: 0 0 var(--bar-h) 0;
  background: var(--wall);
  background-size: cover;
  overflow: hidden;
  transition: background .4s;
}

#desktop::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 60%);
  pointer-events: none;
}

#icons {
  position: absolute;
  inset: 0;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 90px);
  grid-auto-rows: 98px;
  align-content: start;
  gap: 6px;
  z-index: 1;
}

.desk-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 4px;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
  transition: background .12s;
  border: 1px solid transparent;
}

.desk-icon:hover { background: rgba(255,255,255,.12); }
.desk-icon.selected { background: rgba(79,124,255,.35); border-color: rgba(255,255,255,.35); }
.desk-icon .glyph { font-size: 38px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
.desk-icon .label { font-size: 12px; text-align: center; word-break: break-all; line-height: 1.3; }

/* ==================== 窗口 ==================== */
#windows { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

.window {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--win-bg);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  overflow: hidden;
  min-width: 280px;
  min-height: 150px;
  pointer-events: auto;
  animation: winIn .16s ease-out;
  transition: box-shadow .15s, border-color .15s;
}

@keyframes winIn {
  from { opacity: 0; transform: scale(.965) translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.window.active {
  border-color: rgba(255,255,255,.28);
  box-shadow: 0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(79,124,255,.35);
}

.window.maxed { border-radius: 0; }

.titlebar {
  height: 36px;
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 6px 0 12px;
  background: linear-gradient(to bottom, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.t-ico { font-size: 15px; }
.t-title { flex: 1; font-size: 13px; color: #dfe4ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btns { display: flex; gap: 2px; }

.wbtn {
  width: 30px; height: 24px;
  border: none; background: transparent;
  color: #b8c0d0; border-radius: 5px;
  font-size: 13px; display: grid; place-items: center;
}
.wbtn:hover { background: rgba(255,255,255,.14); color: #fff; }
.wbtn.close:hover { background: #e5484d; color: #fff; }

.win-body { flex: 1; overflow: auto; position: relative; font-size: 13px; }

/* 滚动条 */
.win-body::-webkit-scrollbar { width: 10px; height: 10px; }
.win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }

.resizer {
  position: absolute;
  right: 0; bottom: 0;
  width: 16px; height: 16px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.35) 50%);
  border-bottom-right-radius: 10px;
}

/* ==================== 任务栏 ==================== */
#taskbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(16, 18, 24, .85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid rgba(255,255,255,.09);
  z-index: 90000;
}

#startBtn {
  height: 38px;
  padding: 0 14px;
  display: flex; align-items: center; gap: 7px;
  border: none; border-radius: 8px;
  background: rgba(255,255,255,.08);
  color: #e8eaf0; font-size: 13px; font-weight: 500;
}
#startBtn:hover { background: rgba(255,255,255,.18); }
#startBtn.open { background: var(--accent); color: #fff; }

#tasks {
  flex: 1;
  display: flex;
  gap: 6px;
  overflow: hidden;
}

.task-item {
  width: 44px;
  height: 38px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: rgba(255,255,255,.05);
  color: #c6ccd8;
  font-size: 18px; /* 图标大小 */
  transition: background .12s;
}
.task-item:hover { background: rgba(255,255,255,.14); }
.task-item.active {
  background: rgba(79,124,255,.22);
  border-color: rgba(79,124,255,.5);
  color: #fff;
}

#tray {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  font-size: 12px;
  color: #c6ccd8;
  font-variant-numeric: tabular-nums;
}

/* ==================== 开始菜单 ==================== */
#startMenu {
  position: fixed;
  left: 8px;
  bottom: calc(var(--bar-h) + 8px);
  width: 320px;
  padding: 14px;
  background: rgba(22, 24, 32, .95);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 12px;
  box-shadow: 0 24px 70px rgba(0,0,0,.65);
  display: none;
  z-index: 95000;
}
#startMenu.show { display: block; animation: winIn .15s ease-out; }
.sm-head { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; padding-left: 2px; }
.sm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.sm-app {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px; border: none; background: transparent;
  border-radius: 8px; color: #d6dbe6; font-size: 11px;
}
.sm-app:hover { background: rgba(255,255,255,.12); }
.sm-app .glyph { font-size: 24px; }

/* ==================== 通用组件 ==================== */
.btn {
  height: 26px; padding: 0 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 6px; background: rgba(255,255,255,.07);
  color: #d6dbe6; font-size: 12px;
  transition: background .12s;
}
.btn:hover { background: rgba(255,255,255,.16); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.12); }
.grow { flex: 1; }

/* ==================== 记事本 ==================== */
.app-notepad { display: flex; flex-direction: column; height: 100%; }
.pad-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(0,0,0,.18); border-bottom: 1px solid rgba(255,255,255,.07); }
.app-notepad textarea {
  flex: 1; width: 100%; padding: 12px 14px;
  border: none; outline: none; resize: none;
  background: transparent; color: #e8eaf0;
  font-size: 13px; line-height: 1.65; font-family: "Consolas", monospace;
}

/* ==================== 计算器 ==================== */
.calc { display: flex; flex-direction: column; height: 100%; }
.calc-screen { padding: 14px 18px 12px; text-align: right; background: rgba(0,0,0,.28); border-bottom: 1px solid rgba(255,255,255,.07); }
.calc-expr { font-size: 12px; color: var(--text-dim); height: 17px; }
.calc-res { font-size: 30px; font-weight: 600; }
.calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; }
.calc-keys button { border: none; border-radius: 8px; background: rgba(255,255,255,.08); color: #e8eaf0; font-size: 16px; }
.calc-keys button:hover { background: rgba(255,255,255,.17); }
.calc-keys button:active { transform: scale(.95); }
.calc-keys button.op { background: rgba(79,124,255,.3); color: #cfdcff; }
.calc-keys button.eq { background: var(--accent); color: #fff; }
.calc-keys button.fn { background: rgba(255,255,255,.05); color: #a9b3c6; }

/* ==================== 终端 ==================== */
.term { display: flex; flex-direction: column; height: 100%; padding: 10px 12px; font-family: "Consolas", monospace; font-size: 12.5px; line-height: 1.6; background: rgba(8, 10, 16, .55); }
.term-out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.term-row { color: #cdd6e4; }
.term-row.cmd { color: #7ee2a8; }
.term-inputline { display: flex; align-items: flex-start; gap: 7px; flex: 0 0 auto; padding-top: 4px; }
.term-prompt { color: #7ee2a8; white-space: nowrap; }
.term-in { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #e8eaf0; font-family: inherit; font-size: inherit; }

/* ==================== 文件管理器 ==================== */
.fm { display: flex; flex-direction: column; height: 100%; }
.fm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(0,0,0,.18); border-bottom: 1px solid rgba(255,255,255,.07); }
.fm-path { flex: 1; min-width: 100px; font-size: 12px; color: var(--text-dim); font-family: monospace; background: rgba(0,0,0,.25); border-radius: 5px; padding: 4px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-list { flex: 1; overflow: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, 80px); grid-auto-rows: 85px; align-content: start; gap: 6px; }
.fm-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; cursor: pointer; transition: background .1s; border: 1px solid transparent; }
.fm-item:hover { background: rgba(255,255,255,.1); }
.fm-item.selected { background: rgba(79,124,255,.25); border-color: rgba(79,124,255,.5); }
.fm-ico { font-size: 28px; }
.fm-name { font-size: 11px; text-align: center; color: #d6dbe6; word-break: break-all; padding: 0 4px; }

/* ==================== 设置 ==================== */
.settings { padding: 18px 20px; }
.settings h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 0 0 10px; }
.settings h3:not(:first-child) { margin-top: 24px; }
.wall-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
.wall-item { height: 50px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
.wall-item.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,124,255,.25); }
.accent-list { display: flex; gap: 10px; }
.accent-item { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.accent-item.sel { border-color: #fff; }

/* ==================== 画板 ==================== */
.paint { display: flex; flex-direction: column; height: 100%; }
.paint-bar { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: rgba(0,0,0,.18); border-bottom: 1px solid rgba(255,255,255,.07); }
.paint-wrap { flex: 1; background: #fff; display: grid; place-items: center; }
.paint-wrap canvas { max-width: 100%; max-height: 100%; cursor: crosshair; touch-action: none; }

/* ==================== 时钟 ==================== */
.clock-app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: radial-gradient(circle at 50% 30%, rgba(79,124,255,.22), transparent 65%); }
.clock-time { font-size: 52px; font-weight: 300; letter-spacing: 2px; }
.clock-date { font-size: 14px; color: var(--text-dim); }

/* ==================== 贪吃蛇 ==================== */
.snake { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 8px; }
.snake-hud { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
.snake-score { color: #7ee2a8; font-weight: 600; }
.snake canvas { width: 100%; height: auto; border-radius: 8px; display: block; background: #111827; }

/* ==================== 音乐播放器 ==================== */
.music-app { display: flex; flex-direction: column; height: 100%; background: linear-gradient(180deg, #2b2e3b 0%, #1a1c24 100%); }
.music-top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 15px; }
.music-cover { width: 140px; height: 140px; border-radius: 50%; background: #111; display: grid; place-items: center; font-size: 60px; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 4px solid rgba(255,255,255,.05); transition: transform 0.3s; }
.music-cover.playing { animation: spin 12s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.music-title { font-size: 16px; font-weight: bold; text-align: center; }
.music-artist { font-size: 12px; color: var(--text-dim); text-align: center; }
.music-progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-dim); }
.music-progress input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
.music-controls { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 15px; background: rgba(0,0,0,.2); }
.music-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; transition: transform 0.1s; }
.music-btn:hover { color: var(--accent); transform: scale(1.1); }
.music-btn.play { font-size: 32px; }
.music-volume { display: flex; align-items: center; gap: 8px; margin-top: 10px; width: 100%; font-size: 16px;}
.music-volume input { flex: 1; accent-color: var(--accent); }
</style>
</head>
<body>

<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
</div>

<div id="taskbar">
  <button id="startBtn"><span style="color:var(--accent)">◆</span><span>开始</span></button>
  <div id="tasks"></div>
  <div id="tray"><span id="trayClock"></span></div>
</div>

<div id="startMenu">
  <div class="sm-head">所有应用</div>
  <div id="smGrid" class="sm-grid"></div>
</div>

<script>
/* =========================================================
   0. 工具函数
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* =========================================================
   1. 虚拟文件系统
   ========================================================= */
const FS = {
  type: 'dir',
  children: {
    home: {
      type: 'dir',
      children: {
        guest: {
          type: 'dir',
          children: {
            'readme.txt': { type: 'file', content: '欢迎使用 WebOS！\n\n你可以尝试使用文件管理器或者终端。' },
            'todo.txt': { type: 'file', content: '□ 写一个音乐播放器\n□ 优化移动端体验' },
            documents: { type: 'dir', children: {} }
          }
        }
      }
    },
    etc: { type: 'dir', children: { motd: { type: 'file', content: 'WebOS 1.0\n' } } },
    tmp: { type: 'dir', children: {} }
  }
};

let Clipboard = { action: null, name: null, path: null }; // 文件剪贴板

function normalizePath(p, cwd = '/') {
  const raw = p.startsWith('/') ? p : cwd + '/' + p;
  const parts = [];
  for (const seg of raw.split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop();
    else parts.push(seg);
  }
  return '/' + parts.join('/');
}

function getNode(path) {
  if (path === '/' || path === '') return FS;
  let node = FS;
  for (const seg of path.split('/').filter(Boolean)) {
    if (!node.children || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}

function getParent(path) {
  const norm = normalizePath(path);
  if (norm === '/') return null;
  const parentPath = norm.replace(/\/[^/]+$/, '') || '/';
  return { parent: getNode(parentPath), name: norm.split('/').pop() };
}

/* =========================================================
   2. 窗口管理器
   ========================================================= */
const winList = [];
let zTop = 10;
let winSeq = 0;

function focusWin(w) {
  if (!w || !w.el.isConnected) return;
  w.el.style.zIndex = ++zTop;
  winList.forEach(x => {
    const on = x === w;
    x.el.classList.toggle('active', on);
    if (x.taskEl) x.taskEl.classList.toggle('active', on && !x.minimized);
  });
}

function startDrag(w, e) {
  if (w.maximized || e.target.closest('.wbtn')) return;
  const el = w.el, desktop = $('#desktop');
  const sx = e.clientX, sy = e.clientY;
  const sl = el.offsetLeft, st = el.offsetTop;
  const dw = desktop.clientWidth, dh = desktop.clientHeight;

  el.style.transition = 'none';
  const onMove = (ev) => {
    el.style.left = clamp(sl + ev.clientX - sx, -el.offsetWidth + 120, dw - 90) + 'px';
    el.style.top = clamp(st + ev.clientY - sy, 0, dh - 36) + 'px';
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    el.style.transition = '';
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function initResize(w) {
  const handle = w.el.querySelector('.resizer');
  handle.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault(); focusWin(w);
    const el = w.el, sx = e.clientX, sy = e.clientY;
    const sw = el.offsetWidth, sh = el.offsetHeight;
    const onMove = (ev) => {
      el.style.width = Math.max(280, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(160, sh + ev.clientY - sy) + 'px';
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });
}

function minimizeWin(w) {
  w.minimized = true; w.el.style.display = 'none';
  w.el.classList.remove('active');
  if (w.taskEl) w.taskEl.classList.remove('active');
}

function restoreWin(w) {
  w.minimized = false; w.el.style.display = 'flex';
}

function toggleMax(w) {
  const el = w.el;
  if (w.maximized) {
    w.maximized = false; el.classList.remove('maxed');
    el.style.left = w.prev.left; el.style.top = w.prev.top;
    el.style.width = w.prev.w; el.style.height = w.prev.h;
  } else {
    w.prev = { left: el.style.left, top: el.style.top, w: el.style.width, h: el.style.height };
    w.maximized = true; el.classList.add('maxed');
    el.style.left = '0px'; el.style.top = '0px'; el.style.width = '100%'; el.style.height = '100%';
  }
  focusWin(w);
}

function closeWin(w) {
  if (w.onClose) { try { w.onClose(); } catch (e) {} }
  w.el.remove();
  if (w.taskEl) w.taskEl.remove();
  const i = winList.indexOf(w);
  if (i >= 0) winList.splice(i, 1);
  const next = winList.filter(x => !x.minimized).sort((a, b) => (+a.el.style.zIndex) - (+b.el.style.zIndex)).pop();
  if (next) focusWin(next);
}

function openApp(appId, arg) {
  const app = APPS[appId];
  if (!app) return null;

  const id = 'w' + (++winSeq);
  const width = app.width || 600;
  const height = app.height || 420;
  const desktop = $('#desktop');
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  
  const left = Math.max(12, Math.min(dw - width - 12, 40 + (winList.length%6) * 25));
  const top = Math.max(12, Math.min(dh - height - 12, 30 + (winList.length%6) * 25));

  const el = document.createElement('div');
  el.className = 'window active';
  el.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${++zTop}`;
  el.innerHTML = `
    <div class="titlebar">
      <span class="t-ico">${app.icon}</span>
      <span class="t-title">${app.name}</span>
      <div class="t-btns">
        <button class="wbtn min">—</button>
        <button class="wbtn max">▢</button>
        <button class="wbtn close">✕</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="resizer"></div>`;
  $('#windows').appendChild(el);

  const body = el.querySelector('.win-body');
  const w = { id, appId, el, body, minimized: false, maximized: false, taskEl: null, onClose: null };
  winList.push(w);

  // Dock 栏：只显示图标
  const taskEl = document.createElement('button');
  taskEl.className = 'task-item active';
  taskEl.innerHTML = `<span>${app.icon}</span>`;
  taskEl.title = app.name;
  taskEl.addEventListener('click', () => {
    if (w.minimized) { restoreWin(w); focusWin(w); }
    else if (el.classList.contains('active')) minimizeWin(w);
    else focusWin(w);
  });
  $('#tasks').appendChild(taskEl);
  w.taskEl = taskEl;

  el.querySelector('.titlebar').addEventListener('pointerdown', (e) => {
    focusWin(w); startDrag(w, e);
  });
  el.querySelector('.titlebar').addEventListener('dblclick', () => toggleMax(w));
  el.addEventListener('pointerdown', () => focusWin(w), true);

  el.querySelector('.min').onclick = (e) => { e.stopPropagation(); minimizeWin(w); };
  el.querySelector('.max').onclick = (e) => { e.stopPropagation(); toggleMax(w); };
  el.querySelector('.close').onclick = (e) => { e.stopPropagation(); closeWin(w); };

  initResize(w);
  focusWin(w);

  try { app.mount(body, w, arg); } catch (err) { body.innerHTML = `<div style="padding:20px;color:red">应用启动失败</div>`; }
  return w;
}

const APPS = {};

/* ---------- 3.1 终端 ---------- */
const CMDS = {
  help: () => '命令列表: help, ls, cd, pwd, cat, echo, mkdir, touch, rm, date, whoami, open, clear',
  pwd: (args, ctx) => ctx.cwd,
  ls: (args, ctx) => {
    const node = getNode(normalizePath(args[0] || '.', ctx.cwd));
    if (!node) return 'No such directory';
    if (node.type === 'file') return args[0];
    return Object.keys(node.children).map(n => node.children[n].type==='dir'?n+'/':n).join('  ') || '(empty)';
  },
  cd: (args, ctx) => {
    const target = args[0] || '/';
    const p = normalizePath(target, ctx.cwd);
    const node = getNode(p);
    if (!node || node.type !== 'dir') return 'No such directory';
    ctx.cwd = p;
    ctx.updatePrompt();
    return '';
  },
  cat: (args, ctx) => {
    const node = getNode(normalizePath(args[0] || '', ctx.cwd));
    if (!node || node.type === 'dir') return 'File not found';
    return node.content;
  },
  echo: (args) => args.join(' '),
  mkdir: (args, ctx) => {
    if (!args[0]) return 'usage: mkdir <name>';
    const par = getParent(normalizePath(args[0], ctx.cwd));
    if (!par || par.parent.type !== 'dir' || par.parent.children[par.name]) return 'Error';
    par.parent.children[par.name] = { type: 'dir', children: {} };
    return '';
  },
  touch: (args, ctx) => {
    if (!args[0]) return 'usage: touch <name>';
    const par = getParent(normalizePath(args[0], ctx.cwd));
    if (!par || par.parent.type !== 'dir') return 'Error';
    if (!par.parent.children[par.name]) par.parent.children[par.name] = { type: 'file', content: '' };
    return '';
  },
  rm: (args, ctx) => {
    const par = getParent(normalizePath(args[0] || '', ctx.cwd));
    if (!par || !par.parent.children[par.name]) return 'Not found';
    if (par.parent.children[par.name].type === 'dir' && Object.keys(par.parent.children[par.name].children).length) return 'Directory not empty';
    delete par.parent.children[par.name];
    return '';
  },
  date: () => new Date().toLocaleString(),
  whoami: () => 'guest',
  open: (args) => {
    if (!APPS[args[0]]) return 'App not found';
    openApp(args[0]);
    return 'Launched ' + args[0];
  },
  clear: (args, ctx) => { ctx.clear(); return ''; }
};

      </div>`;

    const input = body.querySelector('.term-in');
    const promptEl = body.querySelector('.term-prompt');

      cwd: '/home/guest', 
      clear() { out.innerHTML = ''; },
      updatePrompt() {
        const p = ctx.cwd.replace('/home/guest', '~');
        promptEl.textContent = `guest@webos:${p}$`;
      }
    };

    const print = (text, cls) => {
      const div = document.createElement('div');
      div.className = 'term-row' + (cls ? ' ' + cls : '');
      div.textContent = text;
      out.appendChild(div);
      out.scrollTop = out.scrollHeight;
    };

    print('WebOS Terminal v1.0   ——   输入 help 查看可用命令\n');

    input.addEventListener('keydown', (e) => {

        const line = input.value;
        input.value = '';
        
        // 打印历史

        print(pStr + ' ' + line, 'cmd');
        
        if (line.trim()) { history.push(line); }
        histIdx = history.length;
        
        const res = CMDS[line.split(/\s+/)[0]] ? CMDS[line.split(/\s+/)[0]](line.split(/\s+/).slice(1), ctx) : `未找到命令: ${line.split(/\s+/)[0]}`;
        if (res) print(res);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ''; }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx] || ''; }
        else { histIdx = history.length; input.value = ''; }
      }
    });
    body.addEventListener('click', () => input.focus());
    setTimeout(() => input.focus(), 40);
  }
};

APPS.files = {
  name: '文件', icon: '📁', width: 660, height: 480,
  mount(body) {
    let cwd = '/home/guest';
    let selectedPath = null;

    body.innerHTML = `
      <div class="fm">
        <div class="fm-bar">
          <button class="btn" data-a="newdir">新建文件夹</button>
          <button class="btn" data-a="newfile">新建文件</button>
          <button class="btn" data-a="copy">复制</button>
          <button class="btn" data-a="cut">剪切</button>
          <button class="btn" data-a="paste">粘贴</button>
          <button class="btn primary" data-a="upload">上传文件</button>
          <input type="file" id="fm-upload" style="display:none">
        </div>
        <div class="fm-bar">
          <button class="btn fm-up" style="padding:0 6px">⬆ 上一级</button>
          <div class="fm-path"></div>
        </div>
        <div class="fm-list"></div>
      </div>`;

    const pathEl = body.querySelector('.fm-path');
    const listEl = body.querySelector('.fm-list');
    const fileInput = body.querySelector('#fm-upload');

    function render() {
      pathEl.textContent = cwd;
      listEl.innerHTML = '';
      const node = getNode(cwd);
      if (!node) return;
      
      const entries = Object.entries(node.children).sort((a, b) => {
        if (a[1].type !== b[1].type) return a[1].type === 'dir' ? -1 : 1;
        return a[0].localeCompare(b[0]);
      });

      if (!entries.length) { listEl.innerHTML = '<div style="color:#888;padding:10px">空目录</div>'; return; }

      entries.forEach(([name, n]) => {
        const item = document.createElement('div');
        item.className = 'fm-item' + (selectedPath === `${cwd}/${name}` ? ' selected' : '');
        item.innerHTML = `<div class="fm-ico">${n.type === 'dir' ? '📁' : '📄'}</div><div class="fm-name"></div>`;
        item.querySelector('.fm-name').textContent = name;
        
        item.onclick = (e) => {
          e.stopPropagation();
          selectedPath = `${cwd}/${name}`;
          render();
        };
        item.ondblclick = () => {
          if (n.type === 'dir') { cwd = `${cwd}/${name}`; selectedPath = null; render(); }
          else { openApp('notepad', { content: n.content || '' }); }
        };
        listEl.appendChild(item);
      });
    }

    body.querySelector('.fm-up').onclick = () => {
      if (cwd === '/') return;
      cwd = cwd.replace(/\/[^/]+$/, '') || '/';
      selectedPath = null; render();
    };
    listEl.onclick = () => { selectedPath = null; render(); };

    // 工具栏事件
    body.querySelector('[data-a="newdir"]').onclick = () => {
      const name = prompt('文件夹名称：');
      if (!name) return;
      const node = getNode(cwd);
      if (!node.children[name]) node.children[name] = { type: 'dir', children: {} };
      render();
    };

    body.querySelector('[data-a="newfile"]').onclick = () => {
      const name = prompt('文件名称（例如 a.txt）：');
      if (!name) return;
      const node = getNode(cwd);
      if (!node.children[name]) node.children[name] = { type: 'file', content: '' };
      render();
    };

    body.querySelector('[data-a="copy"]').onclick = () => {
      if (!selectedPath) return alert('请先选择文件或文件夹');
      Clipboard = { action: 'copy', path: selectedPath };
    };

    body.querySelector('[data-a="cut"]').onclick = () => {
      if (!selectedPath) return alert('请先选择文件或文件夹');
      Clipboard = { action: 'cut', path: selectedPath };
    };

    body.querySelector('[data-a="paste"]').onclick = () => {
      if (!Clipboard.path) return alert('剪贴板为空');
      const srcPar = getParent(Clipboard.path);
      const destPar = getNode(cwd);
      const name = Clipboard.path.split('/').pop();
      
      // 不能粘贴到自身或子目录的简单检测
      if (cwd.startsWith(Clipboard.path) && Clipboard.path !== cwd) return alert('无法粘贴到该目录');

      if (destPar.children[name]) return alert('当前目录下已存在同名项目');

      destPar.children[name] = JSON.parse(JSON.stringify(srcPar.parent.children[name])); // 深拷贝
      
      if (Clipboard.action === 'cut') {
        delete srcPar.parent.children[name];
        Clipboard = { action: null, path: null };
      }
      selectedPath = null;
      render();
    };

    body.querySelector('[data-a="upload"]').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const node = getNode(cwd);
        node.children[file.name] = { type: 'file', content: ev.target.result };
        render();
      };
      reader.readAsText(file);
      fileInput.value = '';
    };

    render();
  }
};

    ];

    const titleEl = body.querySelector('.music-title');
    const artistEl = body.querySelector('.music-artist');

    const seekEl = body.querySelector('.seek');
    const currTimeEl = body.querySelector('.curr-time');
    const totalTimeEl = body.querySelector('.total-time');
    const volEl = body.querySelector('.vol');

    function fmtTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function loadTrack(idx) {
      currIndex = idx;
      audio.src = playlist[idx].url;
      titleEl.textContent = playlist[idx].name;
      artistEl.textContent = playlist[idx].artist;
      audio.load();
      if (!audio.paused) playBtn.textContent = '▶';
      cover.classList.remove('playing');
      seekEl.value = 0;
      currTimeEl.textContent = '0:00';
      totalTimeEl.textContent = '0:00';

      if (audio.paused) {
        audio.play().catch(e => console.log('播放受阻'));
        playBtn.textContent = '⏸';
        cover.classList.add('playing');
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        cover.classList.remove('playing');
      }
    };

    prevBtn.onclick = () => loadTrack((currIndex - 1 + playlist.length) % playlist.length);
    nextBtn.onclick = () => loadTrack((currIndex + 1) % playlist.length);

    audio.addEventListener('timeupdate', () => {
      currTimeEl.textContent = fmtTime(audio.currentTime);
      if (audio.duration) {
        seekEl.value = (audio.currentTime / audio.duration) * 100;
        totalTimeEl.textContent = fmtTime(audio.duration);
      }
    });

    seekEl.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekEl.value / 100) * audio.duration;
    });

    volEl.addEventListener('input', () => {
      audio.volume = volEl.value;
    });

    audio.addEventListener('ended', nextBtn.onclick);

    win.onClose = () => {
      audio.pause();
      audio.src = '';
    };

    loadTrack(0);
  }
};

APPS.calc = {
  name: '计算器', icon: '🧮', width: 300, height: 420,
  mount(body) {
    body.innerHTML = `
      <div class="calc">

          <div class="calc-expr"></div>
          <div class="calc-res">0</div>
        </div>
        <div class="calc-keys"></div>
      </div>`;
    const exprEl = body.querySelector('.calc-expr'), resEl = body.querySelector('.calc-res');
    const keysEl = body.querySelector('.calc-keys');
    const KEYS = [
      { t: 'C', v: 'clear', cls: 'fn' }, { t: '±', v: 'neg', cls: 'fn' }, { t: '%', v: '%', cls: 'fn' }, { t: '÷', v: '/', cls: 'op' },
      { t: '7', v: '7' }, { t: '8', v: '8' }, { t: '9', v: '9' }, { t: '×', v: '*', cls: 'op' },
      { t: '4', v: '4' }, { t: '5', v: '5' }, { t: '6', v: '6' }, { t: '−', v: '-', cls: 'op' },
      { t: '1', v: '1' }, { t: '2', v: '2' }, { t: '3', v: '3' }, { t: '+', v: '+', cls: 'op' },
      { t: '(', v: '(', cls: 'fn' }, { t: '0', v: '0' }, { t: '.', v: '.' }, { t: ')', v: ')', cls: 'fn' },
      { t: '=', v: '=', cls: 'eq' }
    ];
    let expr = '';
    const evalExpr = (s) => {
      const clean = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      const val = Function('"use strict"; return (' + clean + ')')();
      return Math.round(val * 1e10) / 1e10;
    };
    const press = (v) => {
      if (v === 'clear') { expr = ''; exprEl.textContent = ' '; resEl.textContent = '0'; return; }
      if (v === 'neg') { expr = expr ? '-(' + expr + ')' : '-'; }
      else if (v === '=') {
        try { expr = String(evalExpr(expr)); exprEl.textContent = ' '; resEl.textContent = expr; } 
        catch { resEl.textContent = '错误'; expr = ''; }
        return;
      } else expr += v;
      
      exprEl.textContent = expr;
      try { resEl.textContent = String(evalExpr(expr)); } catch { resEl.textContent = expr.match(/[0-9.]+$/)?.[0] || '0'; }
    };
    KEYS.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k.t; if (k.cls) b.className = k.cls;
      b.onclick = () => press(k.v);
      keysEl.appendChild(b);
    });
  }
};

      if (dead) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)) { dead = true; draw(); return; }

    const draw = () => {

      for(let i=1;i<N;i++){ g.beginPath();g.moveTo(i*CELL,0);g.lineTo(i*CELL,320);g.stroke();g.beginPath();g.moveTo(0,i*CELL);g.lineTo(320,i*CELL);g.stroke(); }
      g.fillStyle = '#ef4444'; g.beginPath(); g.arc(food.x*CELL+8, food.y*CELL+8, 6, 0, Math.PI*2); g.fill();
      snake.forEach((s,i) => {
        g.fillStyle = i===0 ? '#4ade80' : '#22c55e';

      }
    };
    window.addEventListener('keydown', (e) => {
      if (!win.el.classList.contains('active')) return;
      if (e.key === ' ') { if (dead) reset(); e.preventDefault(); return; }
      const d = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0} }[e.key];
      if (d && !(d.x===-dir.x && d.y===-dir.y)) { nextDir = d; e.preventDefault(); }
    });
    reset(); timer = setInterval(step, 130);
    win.onClose = () => clearInterval(timer);
  }
};

APPS.paint = {
  name: '画板', icon: '🎨', width: 680, height: 500,
  mount(body) {
    body.innerHTML = `<div class="paint"><div class="paint-bar"><input type="color" value="#4f7cff"><input type="range" min="1" max="30" value="4"><button class="btn" data-a="eraser">橡皮擦</button><button class="btn" data-a="clear">清空</button></div><div class="paint-wrap"><canvas width="900" height="540"></canvas></div></div>`;
    const canvas = body.querySelector('canvas'), g = canvas.getContext('2d');
    const color = body.querySelector('input[type="color"]'), size = body.querySelector('input[type="range"]');
    let drawing = false, erasing = false, last = null;
    g.fillStyle = '#fff'; g.fillRect(0,0,900,540);
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*900/r.width, y:(e.clientY-r.top)*540/r.height }; };
    canvas.addEventListener('pointerdown', (e) => { drawing=true; last=pos(e); });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      g.strokeStyle = erasing ? '#fff' : color.value; g.lineWidth = erasing ? +size.value*2.5 : +size.value; g.lineCap = 'round';
      g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p;
    });
    canvas.addEventListener('pointerup', () => drawing=false);
    body.querySelector('[data-a="eraser"]').onclick = (e) => { erasing = !erasing; e.target.style.background = erasing ? 'var(--accent)' : ''; };
    body.querySelector('[data-a="clear"]').onclick = () => { g.fillStyle='#fff'; g.fillRect(0,0,900,540); };
  }
};

/* =========================================================
   4. 系统初始化
   ========================================================= */
const DESKTOP_APPS = ['files', 'notepad', 'calc', 'term', 'paint', 'music', 'clock', 'snake', 'settings'];

function buildDesktop() {
  const wrap = $('#icons'); wrap.innerHTML = '';
  DESKTOP_APPS.forEach(id => {
    const app = APPS[id];
    if (!app) return;
    const d = document.createElement('div');
    d.className = 'desk-icon';
    d.innerHTML = `<div class="glyph">${app.icon}</div><div class="label">${app.name}</div>`;
    d.onclick = (e) => { e.stopPropagation(); $$('.desk-icon').forEach(x => x.classList.remove('selected')); d.classList.add('selected'); };
    d.ondblclick = () => openApp(id);
    wrap.appendChild(d);
  });
}

function buildStartMenu() {
  const grid = $('#smGrid'); grid.innerHTML = '';
  DESKTOP_APPS.forEach(id => {
    const app = APPS[id];
    if (!app) return;
    const b = document.createElement('button');
    b.className = 'sm-app';
    b.innerHTML = `<span class="glyph">${app.icon}</span><span>${app.name}</span>`;
    b.onclick = () => { openApp(id); toggleStartMenu(false); };
    grid.appendChild(b);
  });
}

function toggleStartMenu(force) {
  const menu = $('#startMenu'), btn = $('#startBtn');
  const show = force !== undefined ? force : !menu.classList.contains('show');
  menu.classList.toggle('show', show);
  btn.classList.toggle('open', show);
}

function updateClock() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  $('#trayClock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
}

$('#startBtn').onclick = (e) => { e.stopPropagation(); toggleStartMenu(); };

$('#desktop').addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.window') && !e.target.closest('.desk-icon')) {
    $$('.desk-icon').forEach(x => x.classList.remove('selected'));
    toggleStartMenu(false);
  }
});

document.addEventListener('pointerdown', (e) => {
  const menu = $('#startMenu');
  if (menu.classList.contains('show') && !e.target.closest('#startMenu') && !e.target.closest('#startBtn')) {
    toggleStartMenu(false);
  }
});

// 启动
(function boot() {
  const wall = localStorage.getItem('webos.wall');
  if (wall) $('#desktop').style.background = wall;
  const accent = localStorage.getItem('webos.accent');
  if (accent) document.documentElement.style.setProperty('--accent', accent);

  buildDesktop(); buildStartMenu(); updateClock(); setInterval(updateClock, 1000);
})();
</script>
