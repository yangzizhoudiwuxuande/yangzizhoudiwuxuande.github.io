<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杨梓周的博客</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="header" id="header">
    <div class="header-inner">
      <div class="logo">📝 杨梓周<span>·博客</span></div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" data-page="home" class="active">首页</a></li>
        <li><a href="/about/" data-page="about">关于</a></li>
        <li><a href="/archives/" data-page="archives">归档</a></li>
        <li><a href="/resources/" data-page="resources">资源</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
      <button class="hamburger" id="hamburger" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="container" id="app">
    <main class="main-content" id="mainContent">

      <div id="pageHeader">
        <h1 class="page-title" id="pageTitle">📖 我的文章</h1>
        <p class="page-subtitle" id="pageSubtitle">记录走读生的日常与思考</p>
      </div>

      <div class="search-box" id="searchBox" style="margin-bottom:24px;">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索文章标题、标签..." />
      </div>

      <div id="postList"></div>
      <div class="pagination" id="pagination"></div>

      <div class="post-detail" id="postDetail">
        <button class="back-btn" id="backBtn">← 返回列表</button>
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-content" id="detailContent"></div>
      </div>

    </main>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-card sidebar-about">
        <div class="avatar">杨</div>
        <div class="name">杨梓周</div>
        <div class="bio">走读生 · 热爱记录生活<br />用文字捕捉日常的闪光</div>
      </div>
      <div class="sidebar-card sidebar-categories">
        <h3>📂 分类</h3>
        <div id="categoryList"></div>
      </div>
      <div class="sidebar-card">
        <h3>🏷️ 标签</h3>
        <div class="sidebar-tags" id="tagList"></div>
      </div>
      <div class="sidebar-card">
        <h3>⏳ 近期</h3>
        <div id="recentList" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="socials">
      <a href="https://github.com/yangzizhoudiwuxuande/" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://space.bilibili.com/3690995982010459" target="_blank" aria-label="B站"><i class="fab fa-bilibili"></i></a>
      <a href="https://www.douyin.com/user/MS4wLjABAAAAkjNAm3pz694qXjiz0aIMMtzEROk4btyUuEQOS0pjJKsjgHow-LSajpH48NzGwi-8" target="_blank" aria-label="抖音"><i class="fab fa-tiktok"></i></a>
      <a href="https://weibo.com/u/9014594443" target="_blank" aria-label="微博"><i class="fab fa-weibo"></i></a>
      <a href="https://www.xiaohongshu.com/user/profile/6461f9a90000000012036e1c" target="_blank" aria-label="小红书"><i class="fab fa-xiaohongshu"></i></a>
      <a href="https://www.zhihu.com/people/1-42-16-2-11" target="_blank" aria-label="知乎"><i class="fab fa-zhihu"></i></a>
    </div>
    <p>&copy; 2026 杨梓周 · 走读生的帅，你根本想象不到</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
