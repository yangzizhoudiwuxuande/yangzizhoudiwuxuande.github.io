<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }
        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 5px;
        }
        h1 {
            font-size: 24px;
            color: #dc3545;
            margin-top: 0;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #333;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            font-weight: normal;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 图二手绘中 4☹4 的体现 -->
        <div class="error-code">4☹4</div>
        <h1>错误</h1>
        <p>您的官网不存在 / 模糊 / 未录入</p>
        <p>
            录入·报告新的官网？点击 
            <!-- 根据您的指正，邮箱已修改为 bilibili@astermail.org -->
            <a href="mailto:bilibili@astermail.org?subject=报告新的官网&body=请填写您要报告的官网名称和网址：">发送邮件</a>
        </p>
        <a href="strw.html" class="btn">返回搜官网首页</a>
    </div>
</body>
</html>
